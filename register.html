<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f2e"><title>Регистрация — Martin Forest</title><link rel="stylesheet" href="styles.css"></head><body class="auth-body"><main class="auth-shell"><a class="brand auth-brand" href="index.html"><span>MARTIN</span><b>FOREST</b></a><section class="auth-card"><div class="eyebrow">MARTIN FOREST</div><h1>Регистрация</h1><p class="muted">После регистрации можно создавать деталировки, сохранять заказы и подключать 3D-подписку.</p><form id="form"><div class="field"><label>Имя / компания</label><input id="name" required></div><div class="field"><label>Телефон</label><input id="phone" placeholder="+375 ..."></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Пароль</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><label class="consent"><input id="consent" type="checkbox" required> <span>Согласен на обработку данных и условия использования сервиса.</span></label><button class="btn btn-primary auth-submit">Создать аккаунт</button><div id="error" class="form-error"></div></form><p class="auth-switch">Уже есть аккаунт? <a href="login.html">Войти</a></p></section></main><script src="auth.js"></script><script>
(async()=>{if(await MFAuth.me()){location.href='account.html';return}form.onsubmit=async e=>{e.preventDefault();error.textContent='';try{await MFAuth.api('/api/auth/register',{method:'POST',body:{name:name.value,email:email.value,phone:phone.value,password:password.value}});location.href='account.html'}catch(x){error.textContent=x.message}}})();
</script></body></html>
