<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f2e"><title>Вход — Martin Forest</title><link rel="stylesheet" href="styles.css"></head><body class="auth-body"><main class="auth-shell"><a class="brand auth-brand" href="index.html"><span>MARTIN</span><b>FOREST</b></a><section class="auth-card"><div class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</div><h1>Вход</h1><p class="muted">Деталировка, история заказов и 3D-конструктор доступны после входа.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Пароль</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn btn-primary auth-submit">Войти</button><div id="error" class="form-error"></div></form><p class="auth-switch">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p></section></main><script src="auth.js"></script><script>
(async()=>{if(await MFAuth.me()){location.href='account.html';return}const q=new URLSearchParams(location.search);form.onsubmit=async e=>{e.preventDefault();error.textContent='';try{await MFAuth.api('/api/auth/login',{method:'POST',body:{email:email.value,password:password.value}});location.href=q.get('next')||'account.html'}catch(x){error.textContent=x.message}}})();
</script></body></html>
