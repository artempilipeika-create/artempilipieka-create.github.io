<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f4ed"><title>Студия рендера · Martin Forest</title><link rel="stylesheet" href="/account/planner/render-rooms/file-studio.css"></head><body><div class="wrap"><div class="mast"><span class="brand">MARTIN FOREST</span><span>3D-студия</span></div><div class="title"><h1>Комната с твоей мебелью</h1><button id="save" type="button" disabled>Сохранить PNG</button></div><div id="controls"><label>Отделка комнаты<select id="room"></select></label><label>Мебель<select id="model"><option value="kitchen">Пример кухни</option><option value="wardrobe">Пример шкафа</option><option value="empty">Пустая комната</option><option value="custom" id="own-option" disabled>Моя модель</option></select></label><label>Пол<select id="floor"><option value="palette">По варианту отделки</option><option value="oak">Дуб</option><option value="marble">Плитка под мрамор</option><option value="light-stone">Светлый камень</option><option value="concrete">Бетон</option></select></label><label>Свет<select id="lighting"><option value="palette">По варианту отделки</option><option value="neutral">Нейтральный</option><option value="daylight">Дневной</option><option value="warm">Тёплый</option></select></label><button id="upload" type="button">Открыть GLB или OBJ</button><input id="file" type="file" accept=".glb,.obj"><button id="reset" type="button">Исходный ракурс</button><label>Разрешение PNG<select id="resolution"><option value="standard">1920 × 1080</option><option value="large">2560 × 1440</option><option value="4k">3840 × 2160 · 4К</option></select></label></div>
<div id="custom-controls" hidden><label>Единицы модели<select id="unit"><option value="auto">Автоматически</option><option value="mm">Миллиметры</option><option value="cm">Сантиметры</option><option value="m">Метры</option></select></label><label id="axis-group">Вертикаль OBJ<select id="axis"><option value="y">Ось Y</option><option value="z">Ось Z</option></select></label><button type="button" id="rotate">Повернуть модель на 90°</button></div><div id="stage"></div><footer><span>Мышь вращает камеру. Колесо меняет масштаб. Свой GLB или OBJ можно перетащить в окно.</span><p id="status" role="status">Открываю комнату…</p></footer></div><script type="module" src="/account/planner/render-rooms/file-studio.mjs"></script></body></html>
