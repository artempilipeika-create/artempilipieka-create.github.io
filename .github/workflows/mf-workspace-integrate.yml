name: Apply reviewed workspace layout
on:
  push:
    branches: [mf-webgl-planner-20260926]
    paths: [.github/workflows/mf-workspace-integrate.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/mf-webgl-planner-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply code-only patch within the token's contents permission
        run: |
          test "$GITHUB_REF" = refs/heads/mf-webgl-planner-20260926
          test -z "$(git status --porcelain)"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          source=Path('scripts/workspace-layout.patch').read_text().replace('\n diff --git ','\ndiff --git ')
          parts=source.split('diff --git ')[1:]
          # Workflow changes require a different, explicitly authorized connector
          # action. This job only applies product/test text files, never workflows.
          patch=''.join('diff --git '+part for part in parts if not part.startswith('a/.github/'))
          allowed={'backend/v2/cabinet_assets/constructor-next.html','backend/v2/cabinet_assets/planner/entry.mjs','backend/v2/cabinet_ui.py','tests/webgl/browser_checks.py','tests/webgl/input_checks.py','tests/webgl/live_smoke.py','tests/webgl/release_checks.py','tests/webgl/visual_capture.py','tests/webgl/visual_checks.py'}
          paths={line.split(' b/',1)[1] for line in patch.splitlines() if line.startswith('diff --git ')}
          assert paths==allowed,paths
          subprocess.run(['git','diff','--exit-code','ab246637acaf71a5a9b97a3db3b8d7f3c46e965e','HEAD','--',*sorted(paths)],check=True)
          subprocess.run(['git','apply','--check','--index','--unidiff-zero','-'],input=patch.encode(),check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero','-'],input=patch.encode(),check=True)
          PY
          node --check backend/v2/cabinet_assets/planner/workspace.mjs
          node --check backend/v2/cabinet_assets/planner/entry.mjs
          python -m py_compile backend/v2/cabinet_ui.py tests/webgl/workspace_checks.py tests/webgl/workspace_capture.py
          node --test tests/webgl/core.test.mjs tests/webgl/visual.test.mjs
      - name: Commit product and test files only to the same work branch
        run: |
          test "$(git ls-remote origin refs/heads/mf-webgl-planner-20260926 | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git diff --cached --name-only -- .github)"
          git -c user.name='Martin Forest workspace integration' -c user.email='workspace@users.noreply.github.com' commit -m 'feat(workspace): connect full-viewport drawers, fullscreen editing and planner navigation tests'
          git push origin HEAD:refs/heads/mf-webgl-planner-20260926
          mkdir -p /tmp/workspace-integration
          git rev-parse HEAD > /tmp/workspace-integration/commit.txt
          git bundle create /tmp/workspace-integration/source.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: workspace-integrated-source
          path: /tmp/workspace-integration/
          retention-days: 7
