name: PDF kitchen hero acceptance
on:
  push:
    branches: [mf-pdf-kitchen-hero-20260930]
    paths:
      - 'backend/v2/three_d_api.py'
      - 'backend/v2/three_d_document.py'
      - 'backend/v2/cabinet_assets/3d.js'
      - 'tests/webgl/pdf_kitchen_report_checks.py'
      - '.github/workflows/mf-pdf-kitchen-hero-review.yml'
permissions:
  contents: read
concurrency:
  group: pdf-kitchen-hero-review
  cancel-in-progress: true
jobs:
  syntax-build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install report dependencies
        run: |
          pip install -r backend/v2/requirements.txt pypdf==6.9.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Syntax
        run: |
          node --check backend/v2/cabinet_assets/3d.js
          python -m py_compile backend/v2/three_d_api.py backend/v2/three_d_document.py
      - name: Render cover with image and verify page order
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image,ImageDraw
          from pypdf import PdfReader
          from backend.v2.three_d_document import render
          img=Image.new('RGB',(1200,650),'white')
          d=ImageDraw.Draw(img);d.rectangle((100,100,1100,550),outline='black',width=8)
          b=BytesIO();img.save(b,format='PNG')
          scene={'room':{'width':3000,'depth':1500,'height':2500},'items':[
            {'item_id':'d1','bazis_id':'bazis.0211e4f77fc4','module_type':'base_cabinet','name':'Д1 L','width':600,'height':820,'depth':510,'x':0,'z':0,'rotation':0,'body_variant_id':None,'front_variant_id':None},
            {'item_id':'dr','bazis_id':'bazis.39f282e08f0c','module_type':'base_cabinet','name':'НМРШ2','width':600,'height':820,'depth':450,'x':600,'z':0,'rotation':0,'body_variant_id':None,'front_variant_id':None},
          ]}
          raw=render('Контрольный отчёт',scene,{},b.getvalue())
          Path('/tmp/report.pdf').write_bytes(raw)
          reader=PdfReader(BytesIO(raw))
          assert len(reader.pages)==4
          resources=reader.pages[0].get('/Resources').get('/XObject').get_object()
          assert any(x.get_object().get('/Subtype')=='/Image' for x in resources.values())
          text=reader.pages[1].extract_text() or ''
          assert text.index('Фурнитура')<text.index('Материалы')
          PY
          mkdir -p /tmp/report-render
          pdftoppm -png -r 120 /tmp/report.pdf /tmp/report-render/page >/dev/null 2>&1
          test "$(find /tmp/report-render -name '*.png' | wc -l)" -eq 4
      - name: Build staging image
        run: docker build -t martin-forest-pdf-kitchen-hero:ci .
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@localhost:5432/mf_staging_ci
      MF_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Real PDF download from WebGL canvas
        run: |
          python -m pytest tests/webgl/pdf_kitchen_report_checks.py -vv --timeout=180
          git diff --exit-code
