name: Staging foundation only
on:
  push:
    branches: [martin-forest-v2-staging]
    paths: ['backend/v2/**', 'agent/**', 'tests/**', 'Dockerfile', '.github/workflows/staging-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-foundation:
    if: github.ref == 'refs/heads/martin-forest-v2-staging'
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        stage: [stage01, stage02, stage03, stage04, stage05, stage06]
    runs-on: ubuntu-latest
    container: python:3.12-trixie
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          # Disposable CI-only private Docker network; no ports published to the host.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@postgres:5432/mf_staging_ci
      MF_TEST_EVIDENCE_DIR: qa-output/stage01
    steps:
      - uses: actions/checkout@v4
      - name: Install native Postgres clients and test dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends postgresql-client
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1
      - name: Migrations, regression, protocol and restore tests
        run: timeout -s KILL 120s python -m pytest tests/${{ matrix.stage }} -vv -s --timeout=30 --timeout-method=thread --junitxml=qa-output/stage01/results.xml
      - name: Record synthetic restore evidence in job log
        run: |
          python - <<'PY'
          import json,pathlib
          for path in pathlib.Path('qa-output/stage01').glob('*restore-evidence.json'):
              print('MF_RESTORE_EVIDENCE='+path.name+':'+path.read_text())
          PY
      - name: Preserve non-secret test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-foundation-evidence-${{ matrix.stage }}
          path: qa-output/stage01/
