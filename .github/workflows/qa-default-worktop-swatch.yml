name: Prepare official EGGER F243 ST76 swatch
on:
  push:
    branches: [qa-worktop-swatch-20261125]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Store the verified manufacturer's scan as a standalone Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error --fail --retry 3 --max-time 60 'https://cdn.egger.com/img/pim/8854512009246/8854512042014/original.png' -o /tmp/sheet.png
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from PIL import Image, ImageStat
          p='/tmp/sheet.png'
          a=Image.open(p)
          assert a.size==(3685,7937) and a.info.get('dpi')==(72,72)
          a=a.convert('RGB'); a.thumbnail((1024,2300),Image.Resampling.LANCZOS)
          dst='/tmp/egger-f243-st76.webp'; a.save(dst,'WEBP',quality=83,method=6)
          data=open(dst,'rb').read()
          print('ORIGINAL_SHA256',hashlib.sha256(open(p,'rb').read()).hexdigest())
          print('ASSET_SHA256',hashlib.sha256(data).hexdigest())
          print('ASSET_COLOR','#'+''.join('%02x'%round(v) for v in ImageStat.Stat(a).mean))
          print('ASSET_GIT_SHA',hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest())
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs'
          request=urllib.request.Request(url,data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request) as response: print('PUBLISHED_BLOB',json.load(response)['sha'])
          PY
