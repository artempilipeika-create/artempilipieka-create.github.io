name: Sink and oven modules acceptance
on:
  push:
    branches: [mf-sink-oven-modules-20261005]
permissions:
  contents: read
jobs:
  pure-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Planner geometry and regression
        run: |
          node --check backend/v2/cabinet_assets/3d.js
          node --test tests/webgl/*.test.mjs
          git diff --exit-code
      - name: Build staging image
        run: docker build -t martin-forest-sink-oven:ci .
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@localhost:5432/mf_staging_ci
      MF_TEST_EVIDENCE_DIR: qa-output/sink-oven
      MF_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: UI, real API persistence and native export
        run: |
          python -m pytest tests/webgl/sink_oven_checks.py tests/webgl/drawer_modules_checks.py tests/webgl/upper_modules_checks.py -vv -s --timeout=180 --junitxml=qa-output/sink-oven/results.xml
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sink-oven-evidence
          path: qa-output/sink-oven/
