name: Drawer hardware and PDF pagination acceptance
on:
  push:
    branches: [mf-drawer-hardware-report-pages-20260930]
    paths:
      - 'backend/v2/cabinet_assets/**'
      - 'backend/v2/three_d_document.py'
      - 'tests/webgl/**'
      - '.github/workflows/mf-drawer-hardware-report-review.yml'
permissions:
  contents: read
concurrency:
  group: drawer-hardware-report-review
  cancel-in-progress: true
jobs:
  pure-and-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install report dependencies
        run: |
          pip install -r backend/v2/requirements.txt pypdf==6.9.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Deterministic production rules
        run: |
          node --check backend/v2/cabinet_assets/planner/furniture-core.js
          node --test tests/webgl/kitchen.test.mjs tests/webgl/pricing.test.mjs tests/webgl/upper.test.mjs
      - name: Render and verify module-complete PDF pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from pypdf import PdfReader
          from backend.v2.three_d_document import render
          scene={'room':{'width':3000,'depth':1500,'height':2500},'items':[
            {'item_id':'r2','bazis_id':'bazis.39f282e08f0c','module_type':'base_cabinet','name':'НМРШ2','width':600,'height':820,'depth':450,'x':0,'z':0,'rotation':0,'body_variant_id':None,'front_variant_id':None},
            {'item_id':'r3','bazis_id':'bazis.5f5697e39e27','module_type':'base_cabinet','name':'НМРШ3','width':600,'height':820,'depth':510,'x':600,'z':0,'rotation':0,'body_variant_id':None,'front_variant_id':None},
            {'item_id':'up','bazis_id':'bazis.1ac4fadd97b7','module_type':'wall_cabinet','name':'ВМД2 · Сушка','width':800,'height':920,'depth':317,'x':1200,'z':0,'rotation':0,'body_variant_id':None,'front_variant_id':None}
          ]}
          raw=render('Контрольный отчёт',scene,{})
          Path('/tmp/report.pdf').write_bytes(raw)
          reader=PdfReader(BytesIO(raw))
          assert len(reader.pages)==5, len(reader.pages)
          pages=['\n'.join((p.extract_text() or '').splitlines()) for p in reader.pages]
          assert 'НМРШ2' in pages[1] and 'НМРШ3' not in pages[1] and 'ВМД2 · Сушка' not in pages[1]
          assert 'НМРШ3' in pages[2] and 'НМРШ2' not in pages[2] and 'ВМД2 · Сушка' not in pages[2]
          assert 'ВМД2 · Сушка' in pages[3] and 'НМРШ2' not in pages[3] and 'НМРШ3' not in pages[3]
          assert 'Сводная закупка фурнитуры' in pages[4]
          text='\n'.join(pages)
          for value in ['Направляющая шариковая L-400','Направляющая шариковая L-500','Конфермат 7x50 мм, Zn','24','51','Цена BYN','Сумма BYN']:
              assert value in text,value
          PY
          mkdir -p /tmp/report-render
          pdftoppm -png -r 110 /tmp/report.pdf /tmp/report-render/page >/dev/null 2>&1
          test "$(find /tmp/report-render -name '*.png' | wc -l)" -eq 5
      - name: Build staging image
        run: docker build -t martin-forest-drawer-hardware-report:ci .
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@localhost:5432/mf_staging_ci
      MF_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Drawer hardware browser/export acceptance
        run: |
          python -m pytest tests/webgl/drawer_modules_checks.py tests/webgl/production_rules_checks.py -vv --timeout=180 --maxfail=2
          git diff --exit-code
