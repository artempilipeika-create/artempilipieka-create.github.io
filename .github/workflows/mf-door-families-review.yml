name: Door family selection acceptance
on:
  push:
    branches: [mf-door-families-20261007]
permissions:
  contents: read
concurrency:
  group: door-families-review
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@localhost:5432/mf_staging_ci
      MF_TEST_EVIDENCE_DIR: qa-output/door-families
      MF_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Planner geometry and regression
        run: |
          node --check backend/v2/cabinet_assets/3d.js
          node --test tests/webgl/*.test.mjs
          git diff --exit-code
      - name: Build staging image
        run: docker build -t martin-forest-door-families:ci .
      - name: Isolated disposable Postgres
        run: |
          docker run -d --name mf-test-db -p 127.0.0.1:5432:5432 -e POSTGRES_USER=mf_staging_ci -e POSTGRES_DB=mf_staging_ci -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for i in $(seq 1 30); do
            if docker exec mf-test-db pg_isready -U mf_staging_ci -d mf_staging_ci; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser dependencies
        run: |
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: UI, real API persistence and native export
        run: |
          python -m pytest tests/webgl/door_families_checks.py tests/webgl/corner_sink_checks.py tests/webgl/sink_oven_checks.py tests/webgl/drawer_modules_checks.py tests/webgl/upper_modules_checks.py -vv -s --timeout=180 --junitxml=qa-output/door-families/results.xml
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: door-families-evidence
          path: qa-output/door-families/
      - name: Remove disposable test database
        if: always()
        run: docker rm -f mf-test-db || true
