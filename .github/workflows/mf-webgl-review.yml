name: WebGL planner acceptance
on:
  push:
    branches: [mf-webgl-planner-20260926, mf-pilot-d1-d2-20260926, mf-three-module-pilot-20260927, mf-kitchen-foundation-20260927, mf-visuals-pricing-20260927, mf-client-scene-polish-v2-20260927, mf-client-camera-v3-20260928]
    paths: ['backend/v2/**', 'tests/**', '.github/workflows/mf-webgl-review.yml', '.github/workflows/mf-webgl-live.yml']
permissions:
  contents: read
concurrency:
  group: webgl-planner-review
  cancel-in-progress: true
jobs:
  staging-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the existing staging Docker image without deployment or database access
        run: docker build -t martin-forest-pilot:${{ github.sha }} .
  webgl-browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: planner
            tests: tests/webgl/polish_checks.py tests/webgl/browser_checks.py tests/webgl/input_checks.py tests/webgl/client_pricing_checks.py
          - suite: interaction
            tests: tests/webgl/release_checks.py tests/webgl/visual_checks.py tests/webgl/workspace_checks.py
          - suite: application
            tests: tests/stage07/browser_checks.py tests/stage84/browser_checks.py
          - suite: client
            tests: tests/webgl/client_scene_checks.py tests/webgl/client_camera_checks.py::test_client_v3_presentation_occupancy_views_and_panels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@localhost:5432/mf_staging_ci
      MF_TEST_EVIDENCE_DIR: qa-output/webgl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify clean exact checkout, vendor hashes and pure geometry tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          for source in backend/v2/cabinet_assets/*.js backend/v2/cabinet_assets/planner/*.js backend/v2/cabinet_assets/planner/*.mjs; do node --check "$source"; done
          mkdir -p qa-output/webgl
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('backend/v2/cabinet_assets/planner/vendor')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['version']=='0.180.0' and manifest['local_imports']
          for name,sha in manifest['files'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,name
          assert "from './three.module.js'" in (root/'OrbitControls.js').read_text()
          PY
          set -o pipefail
          node --test tests/webgl/core.test.mjs tests/webgl/visual.test.mjs tests/webgl/materials.test.mjs tests/webgl/kitchen.test.mjs tests/webgl/pricing.test.mjs tests/webgl/room.test.mjs tests/webgl/client-camera.test.mjs | tee qa-output/webgl/core.tap
          node --test tests/order_entry/entry_helpers.test.cjs | tee qa-output/webgl/order-entry.tap
      - name: Install existing pinned browser dependencies
        run: |
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Same-runner accepted Client benchmark and immutable production boundary
        if: matrix.suite == 'client'
        run: |
          git diff --exit-code bc6a2c942b43c14dd892dfb22406f49db6bbfaf5 -- backend/v2/cabinet_assets/planner/furniture-core.js backend/v2/cabinet_assets/planner/module-mesh.mjs backend/v2/cabinet_assets/planner/placement.mjs backend/v2/cabinet_assets/planner/interaction.mjs backend/v2/cabinet_assets/planner/pricing.mjs backend/v2/cabinet_assets/planner/bridge.js backend/v2/cabinet_assets/planner/workspace.css backend/v2/three_d_document.py
          python - <<'PY'
          import subprocess
          from pathlib import Path
          path='backend/v2/cabinet_assets/3d.js'
          before=subprocess.check_output(['git','show','bc6a2c942b43c14dd892dfb22406f49db6bbfaf5:'+path],text=True)
          after=Path(path).read_text()
          def native_export(source):
              return source[source.index('function exportSafeName('):source.index('async function toOrder(')]
          assert native_export(before)==native_export(after)
          PY
          mkdir -p /tmp/mf-client-baseline
          git archive bc6a2c942b43c14dd892dfb22406f49db6bbfaf5 | tar -x -C /tmp/mf-client-baseline
          cp tests/webgl/client_camera_checks.py /tmp/mf-client-baseline/tests/webgl/client_camera_checks.py
          cd /tmp/mf-client-baseline
          MF_TEST_EVIDENCE_DIR="$GITHUB_WORKSPACE/qa-output/webgl/baseline" python -m pytest tests/webgl/client_pricing_checks.py::test_client_room_twenty_pilot_modules_render_budget tests/webgl/client_camera_checks.py::test_record_accepted_camera -vv --timeout=120
      - name: Actual browser and ASGI regression on exact committed source
        if: success() || (matrix.suite == 'client' && !cancelled())
        run: |
          python -m py_compile tests/webgl/live_smoke.py
          python -m pytest ${{ matrix.tests }} -vv --timeout=75 --maxfail=3 --junitxml=qa-output/webgl/browser.xml
          git diff --exit-code
          git rev-parse HEAD > qa-output/webgl/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-browser-acceptance-${{ matrix.suite }}
          path: qa-output/webgl/
          retention-days: 7
  kitchen-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@localhost:5432/mf_staging_ci
      MF_TEST_EVIDENCE_DIR: qa-output/kitchen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned browser dependencies
        run: |
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Actual browser and ASGI regression on exact committed source
        run: |
          python -m py_compile tests/webgl/live_smoke.py
          python -m pytest tests/webgl/kitchen_checks.py -vv -s --timeout=240 --junitxml=qa-output/kitchen/browser.xml
          git diff --exit-code
          git rev-parse HEAD > qa-output/kitchen/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-browser-acceptance
          path: qa-output/kitchen/
          retention-days: 7
  materials-browser:
    strategy:
      fail-fast: false
      matrix:
        donor: [D1-L, D1-P, D2]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@localhost:5432/mf_staging_ci
      MF_TEST_EVIDENCE_DIR: qa-output/materials
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned browser dependencies
        run: |
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Actual browser and ASGI regression on exact committed source
        run: |
          python -m py_compile tests/webgl/live_smoke.py
          python -m pytest 'tests/webgl/material_checks.py::test_materials_modes_history_save_load_native_export[${{ matrix.donor }}]' -vv -s --durations=5 --timeout=180 --junitxml=qa-output/materials/browser.xml
          git diff --exit-code
          git rev-parse HEAD > qa-output/materials/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materials-browser-acceptance-${{ matrix.donor }}
          path: qa-output/materials/
          retention-days: 7
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: python:3.12-trixie
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@postgres:5432/mf_staging_ci
      MF_TEST_EVIDENCE_DIR: qa-output/webgl-backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Matching native Postgres clients and pinned backend dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1
      - name: All existing backend suites including native backup restore
        run: |
          python -m pytest tests/stage01 tests/stage02 tests/stage03 tests/stage04 tests/stage05 tests/stage06 tests/stage07 tests/stage08 tests/stage84 tests/order_entry -vv --timeout=45 --junitxml=qa-output/webgl-backend/backend.xml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code
          git rev-parse HEAD > qa-output/webgl-backend/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-backend-acceptance
          path: qa-output/webgl-backend/
          retention-days: 7
  furniture-visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify accepted fullscreen layout and native integration remain unchanged (kitchen snap is authorized)
        run: |
          git diff --exit-code 8f40ecc6e7841b67076278cd1c4ef1eed207c956 -- backend/v2/cabinet_assets/planner/workspace.css backend/v2/cabinet_assets/planner/bridge.js backend/v2/three_d_document.py
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Same furniture project, accepted layout versus full viewport
        run: |
          mkdir -p /tmp/mf-before
          git archive 3eab6b09a7f0cc99807e5c5bc5f0686840a55b4d backend/v2/cabinet_assets | tar -x -C /tmp/mf-before
          python tests/webgl/visual_capture.py --root /tmp/mf-before --out qa-output/polish/before
          python tests/webgl/visual_capture.py --out qa-output/polish/after
          python tests/webgl/workspace_capture.py --out qa-output/polish/workspace
          python tests/webgl/polish_capture.py --out qa-output/polish/v2
          git diff --exit-code
          git rev-parse HEAD > qa-output/polish/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: furniture-visual-before-after
          path: qa-output/polish/
          retention-days: 7
