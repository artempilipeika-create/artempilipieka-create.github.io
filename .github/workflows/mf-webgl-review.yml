name: WebGL planner acceptance
on:
  push:
    branches: [mf-webgl-planner-20260926]
    paths: ['backend/v2/**', 'tests/**', '.github/workflows/mf-webgl-review.yml', '.github/workflows/mf-webgl-live.yml']
permissions:
  contents: read
concurrency:
  group: webgl-planner-review
  cancel-in-progress: true
jobs:
  webgl-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@localhost:5432/mf_staging_ci
      MF_TEST_EVIDENCE_DIR: qa-output/webgl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify clean exact checkout, vendor hashes and pure geometry tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p qa-output/webgl
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('backend/v2/cabinet_assets/planner/vendor')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['version']=='0.180.0' and manifest['local_imports']
          for name,sha in manifest['files'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,name
          assert "from './three.module.js'" in (root/'OrbitControls.js').read_text()
          PY
          set -o pipefail
          node --test tests/webgl/core.test.mjs | tee qa-output/webgl/core.tap
          node --test tests/order_entry/entry_helpers.test.cjs | tee qa-output/webgl/order-entry.tap
      - name: Install existing pinned browser dependencies
        run: |
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Actual browser and ASGI regression on exact committed source
        run: |
          python -m py_compile tests/webgl/live_smoke.py
          python -m pytest tests/webgl/browser_checks.py tests/webgl/input_checks.py tests/webgl/release_checks.py tests/stage07/browser_checks.py tests/stage84/browser_checks.py -vv --timeout=75 --junitxml=qa-output/webgl/browser.xml
          git diff --exit-code
          git rev-parse HEAD > qa-output/webgl/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-browser-acceptance
          path: qa-output/webgl/
          retention-days: 7
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: python:3.12-trixie
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@postgres:5432/mf_staging_ci
      MF_TEST_EVIDENCE_DIR: qa-output/webgl-backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Matching native Postgres clients and pinned backend dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1
      - name: All existing backend suites including native backup restore
        run: |
          python -m pytest tests/stage01 tests/stage02 tests/stage03 tests/stage04 tests/stage05 tests/stage06 tests/stage07 tests/stage08 tests/stage84 tests/order_entry -vv --timeout=45 --junitxml=qa-output/webgl-backend/backend.xml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code
          git rev-parse HEAD > qa-output/webgl-backend/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-backend-acceptance
          path: qa-output/webgl-backend/
          retention-days: 7
