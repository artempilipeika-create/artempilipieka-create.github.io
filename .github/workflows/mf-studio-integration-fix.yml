name: Studio isolated integration fix
on:
  push:
    branches: [mf-3d-studio-20260925]
    paths: [.github/workflows/mf-studio-integration-fix.yml]
permissions:
  contents: write
  actions: read
jobs:
  guarded-review-only:
    if: github.ref == 'refs/heads/mf-3d-studio-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@localhost:5432/mf_staging_ci
      MF_TEST_EVIDENCE_DIR: qa-output/studio-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36185005787
          name: studio-real-database-verification
          path: review-evidence
      - name: Apply exact reviewed sources; retain original functional assertions
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          files={
              'backend/v2/three_d_api.py':('55ab86d99892dc008385b5d8001a2438c42b0c87','5b1bef28aa9601d0c446ddcbe28e1998931b793667160590cf4386db7f4cfe21'),
              'tests/stage07/browser_checks.py':('f674405b331ab94163784cacf9023c839d281f8b','2fb8ca07b84d2ae9dd3de40112a9978e661b97bcb449142b70c3ae836a542843'),
          }
          for path,(old_sha,new_sha256) in files.items():
              p=Path(path);old=p.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest()==old_sha,path+' changed; review required'
              new=(Path('review-evidence')/path).read_bytes()
              assert hashlib.sha256(new).hexdigest()==new_sha256,path+' candidate mismatch'
              if path.startswith('tests/'):
                  text=new.decode()
                  old="expect(page.locator('#scene-help')).to_contain_text('план помещения')"
                  assert text.count(old)==1
                  text=text.replace(old,"expect(page.locator('#scene-help')).to_contain_text('2D');expect(page.locator('#mode-2d')).to_have_attribute('aria-pressed','true')")
                  new=text.encode()
              p.write_bytes(new)
          PY
          python -m py_compile backend/v2/three_d_api.py tests/stage07/browser_checks.py
          test "$(git hash-object backend/v2/cabinet_assets/3d.js)" = dc1d0a45b6284ba6fa615c7bb2f5c2efdb4db773
          git diff --stat
      - run: pip install -r backend/v2/requirements.txt pytest==9.1.1 httpx==0.28.1 pypdf==6.9.1 playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Full real ASGI Postgres browser regression and original synthetic UI suite
        run: |
          python -m pytest tests/stage07/browser_checks.py tests/stage84/browser_checks.py -vv --junitxml=qa-output/studio-integration/results.xml
          python tests/3d_studio_browser.py
      - name: Commit verified changes ONLY to exact review branch, non-force
        run: |
          test "${GITHUB_REF}" = refs/heads/mf-3d-studio-20260925
          test "$(git status --porcelain --untracked-files=no | wc -l)" = 2
          git add backend/v2/three_d_api.py tests/stage07/browser_checks.py
          git -c user.name='Martin Forest Studio verification' -c user.email='studio-verification@users.noreply.github.com' commit -m 'fix(studio): preserve kitchen scenes in legacy project storage; verify real database round trips'
          git push origin HEAD:refs/heads/mf-3d-studio-20260925
          git rev-parse HEAD > qa-output/studio-integration/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-real-database-verification
          retention-days: 7
          path: |
            qa-output/studio-integration/
            qa-output/studio/
            backend/v2/three_d_api.py
            tests/stage07/browser_checks.py
