name: Stage 6 scoped stale test cleanup
on:
  push:
    branches: [martin-forest-v2-staging]
    paths: ['.github/workflows/stage06-ci-cleanup.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel-known-staging-test:
    if: github.ref == 'refs/heads/martin-forest-v2-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the superseded diagnostic run on the authorized staging branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GH_REPO']
          assert repo=='artempilipeika-create/artempilipieka-create.github.io'
          base='https://api.github.com/repos/'+repo+'/actions/runs/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          run=35860804725
          data=json.load(urllib.request.urlopen(urllib.request.Request(base+str(run),headers=headers)))
          assert data['head_branch']=='martin-forest-v2-staging'
          assert data['head_sha']=='618c24d7f408eaeb75d113518bcb5cf5313dae85'
          if data['status']!='completed':
              with urllib.request.urlopen(urllib.request.Request(base+str(run)+'/force-cancel',data=b'',headers=headers,method='POST')) as r:
                  print('Cancelled superseded staging test',run,r.status)
          else: print('Already completed',run)
          PY
