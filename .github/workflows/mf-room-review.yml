name: Room dimensions acceptance
on:
  push:
    branches: [mf-room-survey-20261009, mf-room-dimensions-20261009]
permissions:
  contents: read
concurrency:
  group: room-review
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@localhost:5432/mf_staging_ci
      MF_TEST_EVIDENCE_DIR: qa-output/room
      MF_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Planner geometry and regression
        run: |
          node --check backend/v2/cabinet_assets/3d.js
          python scripts/build-corner-variants.py
          python scripts/build-tall-variants.py
          node --test tests/webgl/*.test.mjs
          git diff --exit-code
      - name: Build staging image
        run: docker build -t martin-forest-tall:ci .
      - name: Isolated disposable Postgres
        run: |
          docker run -d --name mf-test-db -p 127.0.0.1:5432:5432 -e POSTGRES_USER=mf_staging_ci -e POSTGRES_DB=mf_staging_ci -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for i in $(seq 1 30); do
            if docker exec mf-test-db pg_isready -U mf_staging_ci -d mf_staging_ci; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser dependencies
        run: |
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: UI, real API persistence and native export
        run: |
          python -m pytest tests/webgl/room_checks.py -vv -s --timeout=240 --junitxml=qa-output/room/results.xml
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-evidence
          path: qa-output/room/
      - name: Remove disposable test database
        if: always()
        run: docker rm -f mf-test-db || true
