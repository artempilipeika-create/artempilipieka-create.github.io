name: BAZIS elevation export acceptance
on:
  push:
    branches: [mf-bazis-elevation-export-20260930]
    paths:
      - 'backend/v2/cabinet_assets/3d.js'
      - 'tests/webgl/upper_modules_checks.py'
      - 'tests/webgl/release_checks.py'
      - '.github/workflows/mf-bazis-elevation-review.yml'
permissions:
  contents: read
concurrency:
  group: bazis-elevation-review
  cancel-in-progress: true
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and export contract
        run: |
          node --check backend/v2/cabinet_assets/3d.js
          grep -F "position:{x:it.x,y:globalThis.MF_FURNITURE_CORE.elevation(it,state.room),z:it.z}" backend/v2/cabinet_assets/3d.js
      - name: Build staging image
        run: docker build -t martin-forest-bazis-elevation:ci .
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mf_staging_ci
          POSTGRES_DB: mf_staging_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mf_staging_ci -d mf_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_TEST_DATABASE_URL: postgresql://mf_staging_ci@localhost:5432/mf_staging_ci
      MF_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          pip install -r backend/v2/requirements.txt pytest==9.1.1 pytest-timeout==2.4.0 httpx==0.28.1 pypdf==6.9.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Upper and lower BAZIS export elevation
        run: |
          python -m pytest tests/webgl/upper_modules_checks.py tests/webgl/bazis_elevation_checks.py -vv --timeout=180 --maxfail=2
          git diff --exit-code
